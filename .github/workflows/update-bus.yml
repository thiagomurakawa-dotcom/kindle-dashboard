name: Update bus schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_bus.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bus_schedule.json
          git diff --cached --quiet || (git commit -m 'Update bus schedule' && git push)
