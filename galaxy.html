<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Galaxy Dashboard</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#bdbdbd;font-family:Arial,sans-serif;height:100%;overflow:hidden}body{display:flex;align-items:center;justify-content:center}main{width:92%;max-width:900px;text-align:center;transition:transform 2s,opacity 2s}#clock{font-size:110px;font-weight:300;line-height:1.02;color:#ddd;font-variant-numeric:tabular-nums}#date{font-size:19px}#temp{font-size:42px;margin:12px 0 2px}#condition,#place{font-size:13px;color:#aaa}#forecast{display:flex;justify-content:space-between;margin:20px 0 0;gap:3px}.day{flex:1;min-width:0;font-size:16px}.symbol{height:30px;margin:5px 0;color:#aaa}.symbol svg{height:100%;width:32px}.low{color:#999;margin-top:3px}#status{font-size:10px;color:#999}#status:empty{display:none}body.night main{opacity:.45}@media(orientation:landscape){main{width:94%}#clock{font-size:28vh;line-height:1}#place{font-size:3.5vh}#date{font-size:5vh}#temp{font-size:10vh;margin:1vh 0 0}#condition{font-size:3.8vh}#forecast{margin:2vh 0 0}.day{font-size:4.6vh}.symbol{height:8vh;margin:1vh 0}.low{margin-top:.5vh}}@media(orientation:portrait){#clock{font-size:25vw}.day{font-size:3.7vw}.symbol svg{width:6vw}}
</style></head><body><main id="panel"><div id="place">BLANCHARDSTOWN · DUBLIN</div><div id="clock">--:--</div><div id="date"></div><div id="temp">--°C</div><div id="condition">Loading weather…</div><div id="forecast"></div><div id="status"></div></main><script>
const el=id=>document.getElementById(id);const zone='Europe/Dublin';function tick(){let n=new Date();let h=Number(n.toLocaleTimeString('en-GB',{timeZone:zone,hour:'2-digit',hour12:false}));document.body.classList.toggle('night',h>=22||h<7);el('clock').textContent=n.toLocaleTimeString('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit'});el('date').textContent=n.toLocaleDateString('en-GB',{timeZone:zone,weekday:'long',day:'numeric',month:'long'});}tick();setInterval(tick,1000);
function weather(c){var cloud='<path d="M6 19h13a5 5 0 0 0 0-10 7 7 0 0 0-13-1A5.5 5.5 0 0 0 6 19Z"/>';var sun='<circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/>';var rain='<path d="M7 21l-1 2m7-2-1 2m7-2-1 2"/>';var svg=function(s){return '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+s+'</svg>';};if(c===0)return [svg(sun),'Clear'];if(c<=2)return [svg(cloud+'<path d="M4 7V4m-3 4h2m5-6 1 3"/>'),'Partly cloudy'];if(c===3)return [svg(cloud),'Cloudy'];if(c<=48)return [svg('<path d="M3 7h20M1 12h24M4 17h18"/>'),'Fog'];if(c>=95)return [svg(cloud+'<path d="m13 17-3 5h4l-2 3"/>'),'Thunderstorm'];if((c>=71&&c<=77)||c===85||c===86)return [svg('<path d="M13 2v22M3 7l20 12M3 19 23 7M9 4l4 4 4-4M9 22l4-4 4 4"/>'),'Snow'];return [svg(cloud+rain),'Rain'];}
async function update(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.388&longitude=-6.377&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FDublin&forecast_days=8');if(!r.ok)throw Error();let w=await r.json();el('temp').textContent=Math.round(w.current.temperature_2m)+'°C';el('condition').textContent=weather(w.current.weather_code)[1];el('forecast').innerHTML=w.daily.time.slice(1,8).map((d,j)=>{let i=j+1;return '<div class="day">'+new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',timeZone:zone})+'<div class="symbol">'+weather(w.daily.weather_code[i])[0]+'</div>'+Math.round(w.daily.temperature_2m_max[i])+'°<div class="low">'+Math.round(w.daily.temperature_2m_min[i])+'°</div></div>'}).join('');el('status').textContent='';}catch(e){el('status').textContent='Weather unavailable or outdated · retrying';}}update();setInterval(update,1800000);function shift(){el('panel').style.transform='translate('+Math.round(Math.random()*12-6)+'px,'+Math.round(Math.random()*12-6)+'px)';}shift();setInterval(shift,60000);
</script></body></html>
