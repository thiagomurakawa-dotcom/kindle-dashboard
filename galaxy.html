<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Galaxy Dashboard</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#aaa;font-family:Arial,sans-serif;height:100%;overflow:hidden}body{display:flex;align-items:center;justify-content:center}main{width:90%;max-width:650px;text-align:center;transition:transform 2s}#clock{font-size:clamp(64px,23vw,140px);font-weight:300;color:#bbb;font-variant-numeric:tabular-nums}#date{font-size:18px}#temp{font-size:48px;margin:24px 0 6px}#condition,#place,#status{font-size:13px;color:#888}#forecast{display:flex;justify-content:space-between;margin:32px 0;gap:3px}.day{flex:1;font-size:12px}.symbol{font-size:24px;margin:12px 0}.low{color:#777;margin-top:5px}#status{font-size:10px}@media(orientation:landscape){#clock{font-size:70px}#temp{font-size:30px;margin:8px}#forecast{margin:12px 0}}
</style></head><body><main id="panel"><div id="place">BLANCHARDSTOWN · DUBLIN</div><div id="clock">--:--</div><div id="date"></div><div id="temp">--°C</div><div id="condition">Loading weather…</div><div id="forecast"></div><div id="status"></div></main><script>
const el=id=>document.getElementById(id);const zone='Europe/Dublin';function tick(){let n=new Date();el('clock').textContent=n.toLocaleTimeString('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit'});el('date').textContent=n.toLocaleDateString('en-GB',{timeZone:zone,weekday:'long',day:'numeric',month:'long'});}tick();setInterval(tick,1000);
function weather(c){if(c===0)return ['☀','Clear'];if(c<=2)return ['⛅','Partly cloudy'];if(c===3)return ['☁','Cloudy'];if(c<=48)return ['≋','Fog'];if(c>=95)return ['ϟ','Thunderstorm'];if((c>=71&&c<=77)||c===85||c===86)return ['❄','Snow'];return ['☂','Rain'];}
async function update(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.388&longitude=-6.377&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FDublin&forecast_days=8');if(!r.ok)throw Error();let w=await r.json();el('temp').textContent=Math.round(w.current.temperature_2m)+'°C';el('condition').textContent=weather(w.current.weather_code)[1];el('forecast').innerHTML=w.daily.time.slice(1,8).map((d,j)=>{let i=j+1;return '<div class="day">'+new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',timeZone:zone})+'<div class="symbol">'+weather(w.daily.weather_code[i])[0]+'</div>'+Math.round(w.daily.temperature_2m_max[i])+'°<div class="low">'+Math.round(w.daily.temperature_2m_min[i])+'°</div></div>'}).join('');el('status').textContent='Open-Meteo · Updated '+new Date().toLocaleTimeString('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit'});}catch(e){el('status').textContent='Weather unavailable or outdated · retrying';}}update();setInterval(update,1800000);function shift(){el('panel').style.transform='translate('+Math.round(Math.random()*16-8)+'px,'+Math.round(Math.random()*24-12)+'px)';}shift();setInterval(shift,60000);
</script></body></html>
